[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/create-booking"
  status = 200

[[redirects]]
  from = "/api/my-bookings"
  to = "/.netlify/functions/my-bookings"
  status = 200

[[redirects]]
  from = "/api/cancel-booking"
  to = "/.netlify/functions/cancel-booking"
  status = 200

[[redirects]]
  from = "/api/admin/bookings"
  to = "/.netlify/functions/admin-bookings"
  status = 200

[[redirects]]
  from = "/api/admin/update-booking"
  to = "/.netlify/functions/update-booking"
  status = 200

[[redirects]]
  from = "/api/setup-admin"
  to = "/.netlify/functions/setup-admin"
  status = 200